<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport meta: critical for mobile responsiveness.
      width=device-width → match the device screen width.
      initial-scale=1 → no zoom on load.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon: SVG inline as a data URI for the mosquito/sentinel concept -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦟</text></svg>" />

    <!-- Google Fonts: Orbitron (MMBN display) + Share Tech Mono (terminal/data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Share+Tech+Mono&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

    <title>ArboSentinel — Arboviral Intelligence Platform</title>
  </head>
  <body>
    <!--
      id="root": React mounts its entire component tree here.
      The div starts empty — React fills it via ReactDOM.createRoot().render().
    -->
    <div id="root"></div>

    <!--
      type="module": tells the browser this is an ES module (import/export).
      Vite intercepts this request and serves the compiled TypeScript.
    -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
